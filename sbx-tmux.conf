# Box tmux config: inherit the shared setup, then override the mac-only bits.
source-file ~/personal/dotfiles/home/dot-tmux.conf

# Clipboard over ssh: the box has no pbcopy. Use tmux's native OSC52 so yanks
# reach the host clipboard through the terminal. Needs the outer terminal to
# allow clipboard writes (Ghostty: set `clipboard-write = allow` in its config).
set -g set-clipboard on
bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi D                 send-keys -X copy-pipe-end-of-line-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Grow the current task to another repo (adds a worktree + window)
bind-key -T prefix e run-shell "expand-session"

# Killing the current session switches to another rather than detaching, so
# teardown-session (below) doesn't kick you out of tmux.
set -g detach-on-destroy off

# Tear down the current task: bin its worktree(s) + branch(es), end the session.
# Safe by default (refuses on uncommitted/unpushed work).
bind-key -T prefix X run-shell "teardown-session '#{session_name}'"

# (swap-session on prefix ' now lists both live sessions AND on-disk worktree
# tasks, resuming the latter — so no separate resume binding is needed.)

# Status bar: we have the width — stop truncating. Session name (the task) bold
# on the left; pane title (claude's current-activity summary) full on the right.
# tmux defaults cap status-left at 10 chars and the pane title at 21.
set -g status-left ' #[bold]#S#[default]  '
set -g status-left-length 40
set -g status-right-length 160
set -g status-right ' #{=120:pane_title}   %H:%M %d-%b-%y '
