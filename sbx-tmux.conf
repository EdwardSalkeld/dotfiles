# Standalone sandbox-box tmux config. Deliberately NOT sourcing the mac
# dot-tmux.conf: the two environments are split so box-only bindings (worktree
# tasks, OSC52 clipboard) and mac-only bits (pbcopy, notes) can diverge freely.
# Linked to ~/.tmux.conf in the box by sbx-bootstrap.sh.

# --- base (kept in sync in spirit with the mac config, but independent) ---
set -g prefix C-a
bind C-a send-prefix
set -s escape-time 1
set -g base-index 1
bind | split-window -h
bind - split-window -v
set -g mouse on
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g status-position top

# resize: prefix + alt/ctrl arrows
bind-key -r -T prefix M-Up    resize-pane -U 5
bind-key -r -T prefix M-Down  resize-pane -D 5
bind-key -r -T prefix M-Left  resize-pane -L 5
bind-key -r -T prefix M-Right resize-pane -R 5
bind-key -r -T prefix C-Up    resize-pane -U
bind-key -r -T prefix C-Down  resize-pane -D
bind-key -r -T prefix C-Left  resize-pane -L
bind-key -r -T prefix C-Right resize-pane -R
bind-key -n C-Space resize-pane -Z

# Smart pane switching aware of vim splits (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# copy mode: vi keys + incremental search
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Escape if-shell -F "#{selection_present}" "send-keys -X clear-selection" "send-keys -X cancel"
bind-key -T copy-mode-vi / command-prompt -i -p "(search down)" "send-keys -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "(search up)" "send-keys -X search-backward-incremental \"%%%\""

# --- box workflow ---
# session/worktree navigation (scripts come from dotfiles ~/.local/bin)
bind-key -T prefix s  run-shell "swap-window"
bind-key -T prefix \' run-shell "swap-session"
bind-key -T prefix k  run-shell "browse-claude-panes"
bind-key -T prefix h  run-shell "browse-claude-inbox"
# prefix n: start a new task (type a label) — not the mac notes dir
bind-key -T prefix n  run-shell "new-session"
# Tear down the current task: force-remove its worktree(s) + branch(es) and end
# the session. Destroys unconditionally — push anything worth keeping first.
bind-key -T prefix X  run-shell "teardown-session '#{session_name}'"

# Killing a session switches to another rather than detaching, so teardown
# doesn't kick you out of tmux.
set -g detach-on-destroy off

# Clipboard over ssh: the box has no pbcopy. Use tmux's native OSC52 so yanks
# reach the host clipboard through the terminal (Ghostty: clipboard-write = allow).
set -g set-clipboard on
bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi D                 send-keys -X copy-pipe-end-of-line-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Status bar: we have the width — stop truncating. Session name (the task) bold
# on the left; pane title (claude's current-activity summary) full on the right.
set -g status-left ' #[bold]#S#[default]  '
set -g status-left-length 40
set -g status-right-length 160
set -g status-right ' #{=120:pane_title}   %H:%M %d-%b-%y '
